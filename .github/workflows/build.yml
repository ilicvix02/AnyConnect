name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon
          cp app/build/outputs/apk/release/app-release.apk AnyConnect.apk
          ls -l AnyConnect.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyConnect-apk
          path: AnyConnect.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AnyConnect v1.0.${{ github.run_number }}
          make_latest: true
          files: AnyConnect.apk
          body: |
            Download AnyConnect.apk below, open it on your Android phone, allow install from this source, then turn on the Accessibility permission for AnyConnect.
